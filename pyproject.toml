[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtimevad"
dynamic = ["version"]
description = "Fast speech-end detection for low-latency voice assistants"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kolja Beigel" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "onnxruntime>=1.16"]
keywords = ["vad", "voice activity detection", "endpointing", "turn detection", "voice assistant", "realtime"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/KoljaB/RealtimeVAD"
Issues = "https://github.com/KoljaB/RealtimeVAD/issues"

[tool.setuptools.dynamic]
version = { attr = "RealtimeVAD.__version__" }

[tool.setuptools.packages.find]
include = ["RealtimeVAD*"]

[tool.setuptools.package-data]
RealtimeVAD = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
